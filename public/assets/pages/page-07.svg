<text id="Lorem ipsum dolor sit amet, consectetur " data-node-id="105:97" fill="#F3EEE4" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="736" y="548.91">A possibilidade de interromper </tspan><tspan x="736" y="580.91">essas fronteiras aparece no caso de </tspan><tspan x="736" y="612.91">Emicida. Em 27 de novembro de </tspan><tspan x="736" y="644.91">2019, o artista apresentou AMArelo </tspan><tspan x="736" y="676.91">no Theatro Municipal de São Paulo, </tspan><tspan x="736" y="708.91">ressaltando a ancestralidade e a </tspan><tspan x="736" y="740.91">presença negra em um espaço </tspan><tspan x="736" y="772.91">historicamente associado às elites </tspan><tspan x="736" y="804.91">brancas (Rocha, 2019). O rap já </tspan><tspan x="736" y="836.91">possuía valor cultural antes desse </tspan><tspan x="736" y="868.91">reconhecimento institucional.</tspan></text>
<text id="Duis aute irure dolor in reprehenderit i" data-node-id="105:98" fill="#F3EEE4" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="1072" y="548.91">Sua presença no Municipal pode ser </tspan><tspan x="1072" y="580.91">interpretada como disputa pela </tspan><tspan x="1072" y="612.91">legitimidade: outros artistas, </tspan><tspan x="1072" y="644.91">públicos e memórias passam a </tspan><tspan x="1072" y="676.91">ocupar uma instituição consagrada. </tspan><tspan x="1072" y="708.91">O episódio não demonstra o fim das </tspan><tspan x="1072" y="740.91">desigualdades, mas mostra que as </tspan><tspan x="1072" y="772.91">instituições podem ser </tspan><tspan x="1072" y="804.91">questionadas e transformadas.</tspan></text>
