<text id="Lorem ipsum dolor sit amet, consectetur " data-node-id="106:241" fill="#F3EEE4" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="64" y="580.91">O acesso digital também compõe </tspan><tspan x="64" y="612.91">essas condições. A Figura 3 </tspan><tspan x="64" y="644.91">mostra que 60% dos usuários de </tspan><tspan x="64" y="676.91">internet acessavam a rede </tspan><tspan x="64" y="708.91">somente pelo celular em 2024; </tspan><tspan x="64" y="740.91">entre as classes D/E, eram 86%, </tspan><tspan x="64" y="772.91">contra 18% na classe A (NIC.br; </tspan><tspan x="64" y="804.91">Cetic.br, 2025). O celular permite </tspan><tspan x="64" y="836.91">conhecer, produzir e divulgar </tspan><tspan x="64" y="868.91">cultura,</tspan></text>
<text id="Duis aute irure dolor in reprehenderit i" data-node-id="106:242" fill="#F3EEE4" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="376" y="580.91">mas os dispositivos oferecem </tspan><tspan x="376" y="612.91">possibilidades diferentes para </tspan><tspan x="376" y="644.91">pesquisa, edição e </tspan><tspan x="376" y="676.91">armazenamento. A desigualdade </tspan><tspan x="376" y="708.91">digital pode restringir </tspan><tspan x="376" y="740.91">oportunidades de formação e </tspan><tspan x="376" y="772.91">criação; os dados não permitem </tspan><tspan x="376" y="804.91">classificar os repertórios dos </tspan><tspan x="376" y="836.91">usuários nem considerar inferior </tspan><tspan x="376" y="868.91">a cultura produzida pelo celular.</tspan></text>
