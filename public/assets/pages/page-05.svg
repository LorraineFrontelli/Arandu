<text id="totam rem aperiam, eaque ipsa quae ab il" data-node-id="104:170" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="544" y="275.71">Cabe ao Ministério da </tspan><tspan x="544" y="307.71">Cultura, em articulação com o </tspan><tspan x="544" y="339.71">Ministério da Educação, </tspan><tspan x="544" y="371.71">promover políticas de </tspan><tspan x="544" y="403.71">cidadania cultural que </tspan><tspan x="544" y="435.71">orientem estados, municípios </tspan><tspan x="544" y="467.71">e instituições de ensino. Nas </tspan><tspan x="544" y="499.71">escolas, esse trabalho deve </tspan><tspan x="544" y="531.71">ocorrer desde a educação </tspan><tspan x="544" y="563.71">básica, por meio do contato </tspan><tspan x="544" y="595.71">dos alunos com diferentes </tspan><tspan x="544" y="627.71">manifestações culturais,</tspan></text>
