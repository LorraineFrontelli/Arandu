<text id="Excepteur sint occaecat cupidatat non pr" data-node-id="104:173" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="832" y="84.9096">de origens e níveis de </tspan><tspan x="832" y="116.91">complexidade diversos. O </tspan><tspan x="832" y="148.91">objetivo é mostrar que </tspan><tspan x="832" y="180.91">nenhuma cultura é </tspan><tspan x="832" y="212.91">naturalmente superior ou </tspan><tspan x="832" y="244.91">inferior e que os critérios de </tspan><tspan x="832" y="276.91">prestígio cultural também são </tspan><tspan x="832" y="308.91">construídos socialmente e </tspan><tspan x="832" y="340.91">influenciados pelos grupos </tspan><tspan x="832" y="372.91">que ocupam posições de </tspan><tspan x="832" y="404.91">maior poder.</tspan></text>
<text id="deleniti atque corrupti quos dolores et " data-node-id="104:176" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="1120" y="84.9096">Assim, a educação pode </tspan><tspan x="1120" y="116.91">formar cidadãos mais críticos, </tspan><tspan x="1120" y="148.91">capazes de reconhecer a </tspan><tspan x="1120" y="180.91">diversidade cultural sem </tspan><tspan x="1120" y="212.91">reproduzir essas hierarquias.</tspan></text>
