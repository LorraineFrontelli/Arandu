<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1024" viewBox="0 0 1440 1024" fill="none">
<g id="04 Â· Editorial I" data-node-id="104:141">
<rect width="1440" height="1024" fill="white" />
<text id="EDITORIAL" data-node-id="104:142" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="64" letter-spacing="4px" font-weight="400"><tspan x="64" y="114.271">EDITORIAL</tspan></text>
<text id="CULTURA E DIREITO DE PARTICIPAR" data-node-id="104:143" fill="#A60000" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="24" letter-spacing="2.4px" font-weight="400"><tspan x="64" y="163.352">CULTURA E DIREITO DE PARTICIPAR</tspan></text>
<text id="orem ipsum dolor sit amet, consectetur a" data-node-id="104:144" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="131.9" y="244.91">ara Marilena Chauí, </tspan><tspan x="131.9" y="276.91">cultura não se limita </tspan><tspan x="131.9" y="308.91">às belas artes, pois </tspan><tspan x="131.9" y="340.91">envolve criação,</tspan></text>
<text id="incididunt ut labore et dolore magna ali" data-node-id="104:145" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="64" y="397.31">formação, participação e o </tspan><tspan x="64" y="429.31">direito de produzir sentidos. </tspan><tspan x="64" y="461.31">Embora a legislação brasileira </tspan><tspan x="64" y="493.31">garanta os direitos culturais, </tspan><tspan x="64" y="525.31">nem todas as manifestações </tspan><tspan x="64" y="557.31">recebem o mesmo </tspan><tspan x="64" y="589.31">reconhecimento. Essa </tspan><tspan x="64" y="621.31">hierarquia está menos ligada </tspan><tspan x="64" y="653.31">à complexidade das obras do </tspan><tspan x="64" y="685.31">que às condições sociais de </tspan><tspan x="64" y="717.31">quem produz, consome e </tspan><tspan x="64" y="749.31">decide o que será valorizado.
</tspan><tspan x="64" y="781.31">Essas condições são desiguais. </tspan><tspan x="64" y="813.31">Muitos jovens deixam a escola </tspan><tspan x="64" y="845.31">para trabalhar,</tspan></text>
<text id="P" data-node-id="104:146" fill="#A60000" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="96" letter-spacing="0px" font-weight="400"><tspan x="64" y="295.406">P</tspan></text>
<text id="fugit, sed quia consequuntur magni dolor" data-node-id="104:149" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="354.7" y="244.91">sendo essa necessidade </tspan><tspan x="354.7" y="276.91">apontada por 43% dos que não </tspan><tspan x="354.7" y="308.91">concluíram o ensino médio </tspan><tspan x="354.7" y="340.91">(IBGE, 2025). Mulheres </tspan><tspan x="354.7" y="372.91">ocupadas dedicam mais tempo </tspan><tspan x="354.7" y="404.91">ao cuidado doméstico que os </tspan><tspan x="354.7" y="436.91">homens (IBGE, 2022), </tspan><tspan x="354.7" y="468.91">enquanto pessoas pretas e </tspan><tspan x="354.7" y="500.91">pardas também enfrentam </tspan><tspan x="354.7" y="532.91">menor acesso a equipamentos </tspan><tspan x="354.7" y="564.91">culturais (IBGE, 2021). Além </tspan><tspan x="354.7" y="596.91">disso, pessoas com ensino </tspan><tspan x="354.7" y="628.91">superior frequentam mais </tspan><tspan x="354.7" y="660.91">concertos de música clássica </tspan><tspan x="354.7" y="692.91">(JLeiva; Datafolha, 2026). </tspan><tspan x="354.7" y="724.91">Esses dados mostram que </tspan><tspan x="354.7" y="756.91">tempo, formação e acesso </tspan><tspan x="354.7" y="788.91">influenciam diretamente o </tspan><tspan x="354.7" y="820.91">contato com diferentes </tspan><tspan x="354.7" y="852.91">manifestações culturais.</tspan></text>
<text id="Et harum quidem rerum facilis est et exp" data-node-id="104:152" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="645.3" y="244.91">O problema aumenta quando </tspan><tspan x="645.3" y="276.91">grupos com mais acesso à </tspan><tspan x="645.3" y="308.91">formação, aos recursos e aos </tspan><tspan x="645.3" y="340.91">espaços de decisão também </tspan><tspan x="645.3" y="372.91">influenciam aquilo que é </tspan><tspan x="645.3" y="404.91">considerado cultura de maior </tspan><tspan x="645.3" y="436.91">valor. Assim, manifestações </tspan><tspan x="645.3" y="468.91">próximas aos padrões </tspan><tspan x="645.3" y="500.91">valorizados pelas elites podem </tspan><tspan x="645.3" y="532.91">receber maior prestígio, </tspan><tspan x="645.3" y="564.91">enquanto culturas populares, </tspan><tspan x="645.3" y="596.91">sejam simples ou complexas, </tspan><tspan x="645.3" y="628.91">acabam menos reconhecidas. </tspan><tspan x="645.3" y="660.91">Isso não demonstra </tspan><tspan x="645.3" y="692.91">incapacidade dos grupos </tspan><tspan x="645.3" y="724.91">populares, mas desigualdade </tspan><tspan x="645.3" y="756.91">nas condições de acesso, </tspan><tspan x="645.3" y="788.91">formação e reconhecimento.</tspan></text>
