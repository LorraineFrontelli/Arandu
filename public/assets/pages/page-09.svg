<text id="Lorem ipsum dolor sit amet, consectetur _2" data-node-id="105:166" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="14" letter-spacing="0em" font-weight="400"><tspan x="140" y="884.497">Essa distinção não determina a </tspan><tspan x="140" y="904.497">complexidade de cada </tspan><tspan x="140" y="924.497">manifestação.</tspan></text>
