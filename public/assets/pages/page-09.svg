<text id="RepertÃ³rio e capital cultural" data-node-id="105:161" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="28" letter-spacing="0px" font-weight="400"><tspan x="992" y="249.893">Repertório e capital cultural</tspan></text>
<text id="Sed ut perspiciatis unde omnis iste natu" data-node-id="105:162" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="992" y="292.11">Repertório é o conjunto de referências, </tspan><tspan x="992" y="324.11">conhecimentos e experiências que permite </tspan><tspan x="992" y="356.11">estabelecer relações e reconhecer </tspan><tspan x="992" y="388.11">significados. Ele se forma na família, na </tspan><tspan x="992" y="420.11">escola, na convivência, na leitura e no </tspan><tspan x="992" y="452.11">contato com manifestações culturais. </tspan><tspan x="992" y="484.11">Durkheim entende a educação como </tspan><tspan x="992" y="516.11">formação social das novas gerações, pela </tspan><tspan x="992" y="548.11">transmissão de referências e disposições </tspan><tspan x="992" y="580.11">necessárias à vida coletiva (Durkheim, 2011).</tspan></text>
<text id="Ritmo, linguagem e memÃ³ria" data-node-id="105:163" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="28" letter-spacing="0px" font-weight="400"><tspan x="64" y="817.893">Ritmo, linguagem e memória</tspan></text>
<text id="Camadas de sentido no rap e na mÃºsica de" data-node-id="105:164" fill="#4A4540" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="14" font-style="italic" letter-spacing="0px" font-weight="400"><tspan x="64" y="844.297">Camadas de sentido no rap e na música de concerto</tspan></text>
