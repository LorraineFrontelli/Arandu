<rect width="1440" height="1024" fill="white" />
<text id="COMPLEXIDADE" data-node-id="105:150" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="96" letter-spacing="2px" font-weight="400"><tspan x="64" y="139.406">COMPLEXIDADE</tspan></text>
<g id="Bloco" data-node-id="105:151">
<text id="NÃO Ã PRESTÃGIO" data-node-id="105:152" transform="translate(998.585 103.467) rotate(-4)" fill="#A60000" style="white-space: pre" xml:space="preserve" font-family="Barlow Condensed" font-size="48" letter-spacing="0px" font-weight="900"><tspan x="0" y="43.2">NÃO É PRESTÍGIO</tspan></text>
</g>
<text id="Complexidade nÃ£o Ã© dificuldade" data-node-id="105:153" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="28" letter-spacing="0px" font-weight="400"><tspan x="64" y="249.893">Complexidade não é dificuldade</tspan></text>
<text id="Lorem ipsum dolor sit amet, consectetur " data-node-id="105:154" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="64" y="292.11">Também é necessário distinguir complexidade </tspan><tspan x="64" y="324.11">de dificuldade e de prestígio. Uma expressão </tspan><tspan x="64" y="356.11">familiar pode parecer simples porque seus </tspan><tspan x="64" y="388.11">códigos foram aprendidos na convivência; </tspan><tspan x="64" y="420.11">outra pode parecer difícil porque suas </tspan><tspan x="64" y="452.11">referências são desconhecidas.</tspan></text>
<text id="Duis aute irure dolor in reprehenderit i" data-node-id="105:155" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="64" y="496.91">Bourdieu ajuda a compreender esse processo </tspan><tspan x="64" y="528.91">ao mostrar que a percepção artística mobiliza </tspan><tspan x="64" y="560.91">códigos adquiridos socialmente (Bourdieu, </tspan><tspan x="64" y="592.91">1968). A dificuldade de um observador, </tspan><tspan x="64" y="624.91">portanto, não comprova incapacidade </tspan><tspan x="64" y="656.91">intelectual nem superioridade da </tspan><tspan x="64" y="688.91">manifestação: pode revelar uma distância </tspan><tspan x="64" y="720.91">entre suas experiências e as referências </tspan><tspan x="64" y="752.91">apresentadas.</tspan></text>
