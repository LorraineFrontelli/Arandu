<text id="âLorem ipsum dolor sit amet, consectetur" data-node-id="105:172" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" font-style="italic" letter-spacing="0px" font-weight="400"><tspan x="1041.46" y="814.71">“Diferenças de técnica e elaboração </tspan><tspan x="1037.25" y="846.71">existem, mas o prestígio não decorre </tspan><tspan x="1092.54" y="878.71">exclusivamente delas.” </tspan><tspan x="1050.15" y="910.71">— Bourdieu, 1968; Nogueira, 2021</tspan></text>
