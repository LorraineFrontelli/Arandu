<text id="Ut enim ad minim veniam, quis nostrud ex" data-node-id="105:168" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="14" letter-spacing="0em" font-weight="400"><tspan x="438.7" y="877.497">São possibilidades de análise, não </tspan><tspan x="438.7" y="897.497">medidas de superioridade entre </tspan><tspan x="438.7" y="917.497">gêneros.</tspan></text>
