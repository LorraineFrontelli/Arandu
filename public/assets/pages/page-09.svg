<text id="Duis aute irure dolor in reprehenderit i_2" data-node-id="105:170" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="14" letter-spacing="0em" font-weight="400"><tspan x="737.3" y="877.497">Repertório e capital cultural não são, </tspan><tspan x="737.3" y="897.497">assim, sinônimos completos.</tspan></text>
