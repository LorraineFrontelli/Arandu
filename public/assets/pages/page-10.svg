</g>
<text id="ÃMILE DURKHEIM" data-node-id="105:189" fill="white" style="white-space: pre" xml:space="preserve" font-family="Barlow Condensed" font-size="24" letter-spacing="1.2px" font-weight="800"><tspan x="448" y="847.6">ÉMILE
</tspan><tspan x="448" y="876.6">DURKHEIM</tspan></text>
<text id="At vero eos et accusamus et iusto odio d" data-node-id="105:190" fill="white" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="640" y="308.91">Os artigos 215 e 216 da </tspan><tspan x="640" y="340.91">Constituição reconhecem os </tspan><tspan x="640" y="372.91">direitos culturais e a </tspan><tspan x="640" y="404.91">diversidade das expressões </tspan><tspan x="640" y="436.91">brasileiras; a ideia de </tspan><tspan x="640" y="468.91">cidadania cultural acrescenta </tspan><tspan x="640" y="500.91">que as pessoas são sujeitos </tspan><tspan x="640" y="532.91">dessa produção e participação </tspan><tspan x="640" y="564.91">(Brasil, 1988; Chauí, 2006).</tspan></text>
