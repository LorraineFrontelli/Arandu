<g id="Intelectuais: o que pensam?" data-node-id="105:183">
<text fill="white" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="80" letter-spacing="-1px" font-weight="400"><tspan x="64" y="126.839">Intelectuais:
</tspan></text>
<text fill="white" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="80" font-style="italic" letter-spacing="-1px" font-weight="400"><tspan x="64" y="206.839">o que pensam?</tspan></text>
</g>
<text id="Lorem ipsum dolor sit amet, consectetur " data-node-id="105:184" fill="white" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="64" y="308.91">Bourdieu acrescenta que </tspan><tspan x="64" y="340.91">conhecimentos e disposições </tspan><tspan x="64" y="372.91">adquiridos ao longo do tempo </tspan><tspan x="64" y="404.91">podem funcionar como </tspan><tspan x="64" y="436.91">capital cultural: além de </tspan><tspan x="64" y="468.91">ajudarem a compreender </tspan><tspan x="64" y="500.91">manifestações, podem </tspan><tspan x="64" y="532.91">produzir vantagens quando </tspan><tspan x="64" y="564.91">são reconhecidos e </tspan><tspan x="64" y="596.91">valorizados em determinados </tspan><tspan x="64" y="628.91">contextos (Bourdieu, 1979).</tspan></text>
