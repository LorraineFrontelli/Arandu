<text id="PIERRE BOURDIEU" data-node-id="105:186" fill="white" style="white-space: pre" xml:space="preserve" font-family="Barlow Condensed" font-size="24" letter-spacing="1.2px" font-weight="800"><tspan x="160" y="847.6">PIERRE
</tspan><tspan x="160" y="876.6">BOURDIEU</tspan></text>
<text id="Sed ut perspiciatis unde omnis iste natu" data-node-id="105:187" fill="white" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="352" y="308.91">Durkheim entende a educação </tspan><tspan x="352" y="340.91">como formação social das </tspan><tspan x="352" y="372.91">novas gerações, pela </tspan><tspan x="352" y="404.91">transmissão de referências e </tspan><tspan x="352" y="436.91">disposições necessárias à vida </tspan><tspan x="352" y="468.91">coletiva (Durkheim, 2011). </tspan><tspan x="352" y="500.91">Entretanto, as condições </tspan><tspan x="352" y="532.91">dessa aprendizagem variam </tspan><tspan x="352" y="564.91">entre meios sociais, abrindo a </tspan><tspan x="352" y="596.91">questão de quem recebe </tspan><tspan x="352" y="628.91">oportunidades de ampliar seu </tspan><tspan x="352" y="660.91">repertório.</tspan></text>
<g id="Retrato_2" data-node-id="105:188">
<path d="M352 848C352 825.909 369.909 808 392 808C414.091 808 432 825.909 432 848C432 870.091 414.091 888 392 888C369.909 888 352 870.091 352 848Z" fill="#141210" />
