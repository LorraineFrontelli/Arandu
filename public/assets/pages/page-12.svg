<text id="Lorem ipsum dolor sit amet, consectetur _2" data-node-id="174:1015" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="329" y="817.91">Os levantamentos medem participação declarada, oferta territorial e formas de acesso digital; não medem diretamente </tspan><tspan x="329" y="849.91">repertório, complexidade, compreensão ou internalização. Participar uma vez ou várias vezes no período não constitui </tspan><tspan x="329" y="881.91">diferença nos percentuais apresentados. As relações entre dados e teoria são interpretações, sem atribuição de </tspan><tspan x="329" y="913.91">causalidade única.</tspan></text>
