<text id="orem ipsum dolor sit amet, consectetur a" data-node-id="107:207" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="691.9" y="244.91">eliópolis, na zona sul de São Paulo, </tspan><tspan x="691.9" y="276.91">é o ponto de partida do Instituto </tspan><tspan x="691.9" y="308.91">Baccarelli, criado em 1996 depois </tspan><tspan x="691.9" y="340.91">de um incêndio que deixou </tspan><tspan x="691.9" y="372.91">centenas de</tspan></text>
<text id="nostrud exercitation ullamco laboris nis" data-node-id="107:208" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="624" y="403.31">famílias desamparadas. Começou com 36 </tspan><tspan x="624" y="435.31">crianças.</tspan></text>
<text id="H" data-node-id="107:209" fill="#A60000" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="96" letter-spacing="0px" font-weight="400"><tspan x="624" y="295.407">H</tspan></text>
<text id="Excepteur sint occaecat cupidatat non pr" data-node-id="107:210" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="624" y="479.509">Hoje atende cerca de 1.600 alunos.</tspan></text>
<text id="Nemo enim ipsam voluptatem quia voluptas" data-node-id="107:211" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="624" y="524.21">No núcleo de Heliópolis, são mais de 300 </tspan><tspan x="624" y="556.21">turmas e quatro grupos artísticos.</tspan></text>
<text id="Nemo enim ipsam voluptatem quia voluptas_2" data-node-id="198:163" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="624" y="601.71">Em 2021, venceu o Prêmio de Inovação da </tspan><tspan x="624" y="633.71">Classical:NEXT (Concerto, 2021).</tspan></text>
<text id="consequuntur magni dolores eos qui ratio" data-node-id="107:212" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="1016" y="244.91">A Orquestra Sinfônica Heliópolis, </tspan><tspan x="1016" y="276.91">apontada como a primeira orquestra </tspan><tspan x="1016" y="308.91">formada em uma favela, convive com o </tspan><tspan x="1016" y="340.91">Coral Heliópolis, o Coral Jovem Heliópolis </tspan><tspan x="1016" y="372.91">e a Orquestra Juvenil Heliópolis. Os alunos </tspan><tspan x="1016" y="404.91">frequentam a instituição de quatro a cinco </tspan><tspan x="1016" y="436.91">dias por semana, no contraturno escolar, e </tspan><tspan x="1016" y="468.91">precisam estar matriculados na escola. </tspan><tspan x="1016" y="500.91">Psicólogos acompanham os estudantes </tspan><tspan x="1016" y="532.91">(Propmark, 2026).</tspan></text>
<text id="consequuntur magni dolores eos qui ratio_2" data-node-id="198:164" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="1016" y="578.71">O prêmio reconheceu o Tocando Juntos </tspan><tspan x="1016" y="610.71">por Heliópolis, que arrecadou alimentos </tspan><tspan x="1016" y="642.71">na pandemia (Concerto, 2021).</tspan></text>
