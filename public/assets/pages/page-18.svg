<text id="SARAU DA COOPERIFA" data-node-id="107:231" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="48" letter-spacing="2px" font-weight="400"><tspan x="64" y="488.203">SARAU DA COOPERIFA</tspan></text>
<text id="Lorem ipsum dolor sit amet, consectetur " data-node-id="107:232" fill="#141210" style="white-space: pre" xml:space="preserve" font-family="Playfair" font-size="20" letter-spacing="0px" font-weight="400"><tspan x="64" y="620.91">No bar do Zé Batidão, na periferia de São Paulo, o Sarau da </tspan><tspan x="64" y="652.91">Cooperifa reúne poetas e público em torno da leitura e da </tspan><tspan x="64" y="684.91">declamação de poesia. Em uma noite de julho de 2008, </tspan><tspan x="64" y="716.91">Sérgio Vaz registrou cerca de 400 pessoas, muitas delas na </tspan><tspan x="64" y="748.91">primeira vez, vindas de vários bairros, e cerca de 50 poetas </tspan><tspan x="64" y="780.91">da Cooperifa, com o público em silêncio e atento (Vaz, </tspan><tspan x="64" y="812.91">2008).</tspan></text>
